name: Release

# Reusable workflow, step 1 of 2: computes version and notes with git-cliff,
# checks the notes and tags the dispatched commit. It creates no release. The
# caller then builds its assets from the tag (optional) and calls
# release-draft.yml, which creates the draft with notes and assets in one go.
# Publishing the draft triggers repo-specific delivery (Docker, Helm, docs).
#
# The caller's stub carries the triggers (workflow_dispatch, optionally push
# to the default branch, which should run as a dry run). See "Release
# workflow" in the README.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release, e.g. v0.4.0. Leave empty and it is computed from the commits.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Render the version and notes only. Do not create a tag.'
        required: false
        type: boolean
        default: true
      force:
        description: 'Release even though commits are missing from the notes. Recovery only.'
        required: false
        type: boolean
        default: false
      cliff_config:
        description: 'Path to a git-cliff config. Defaults to the shared config from the workflow repository.'
        required: false
        type: string
        default: '.release-tooling/cliff.toml'
      required_checks:
        description: 'JSON array of check-run names that must have passed on the released commit before it is tagged, e.g. ["test-e2e / test-e2e"].'
        required: false
        type: string
        default: '[]'
      checks_skip_paths:
        description: 'JSON array of path globs whose changes do not run the required checks (the paths-ignore of the workflow that runs them). A commit touching only these may be released on the checks of the commit before it.'
        required: false
        type: string
        default: '["docs/**", "**/*.md"]'
    outputs:
      version:
        description: 'The computed/released version.'
        value: ${{ jobs.prepare.outputs.version }}
      sha:
        description: 'The commit SHA being released.'
        value: ${{ jobs.prepare.outputs.sha }}
      tag_created:
        description: 'Whether this run created the release tag. Gate the asset build and release-draft.yml on it.'
        value: ${{ jobs.prepare.outputs.tag_created }}

permissions:
  contents: read

jobs:
  prepare:
    name: Compute version, notes and tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the tag ref
      checks: read # required_checks
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      tag_created: ${{ steps.tag.outputs.tag_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard - releases are cut from the default branch
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          case "$REF_TYPE" in
            branch)
              if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
                echo "::error::Releases are cut from ${DEFAULT_BRANCH}, not ${REF_NAME}."
                exit 1
              fi
              ;;
            tag)
              # A tag carries the release only if it points at code that landed
              # on the default branch. fetch-depth: 0 puts the branch tip in
              # refs/remotes/origin/<default>.
              default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
              if ! git rev-parse -q --verify "$default_ref" >/dev/null; then
                echo "::error::Could not resolve ${default_ref}; a release needs full history."
                exit 1
              fi
              if ! git merge-base --is-ancestor HEAD "$default_ref"; then
                echo "::error::Tag ${REF_NAME} does not point at a commit on ${DEFAULT_BRANCH}."
                exit 1
              fi
              ;;
            *)
              echo "::error::Releases must be cut from ${DEFAULT_BRANCH}; got ${REF_TYPE:-unknown} ${REF_NAME}."
              exit 1
              ;;
          esac

      - name: Install git-cliff
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: git-cliff@2.13.1

      # Any draft blocks a release. A tagged one is a release that was cut but
      # never published; cutting the next one on top would skip it. An
      # untagged one is left over from the moving-draft flow before v5:
      # publishing it would tag whatever commit it last pointed at, with
      # whatever assets it carries, so it must be deleted, not kept around.
      # A dry run (and so a push run) only previews, and just warns.
      - name: Guard - no draft release pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          draft_tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName')

          cut=() untagged=()
          for tag in $draft_tags; do
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              cut+=("$tag")
            else
              untagged+=("$tag")
            fi
          done

          msgs=()
          if [ ${#cut[@]} -gt 0 ]; then
            msgs+=("Release ${cut[*]} was cut but not published. Publish its draft to ship it. Its tag cannot be deleted where protect-release-tags is active, so to abandon it delete the draft and release the next patch.")
          fi
          if [ ${#untagged[@]} -gt 0 ]; then
            msgs+=("Draft ${untagged[*]} has no tag (left over from dev-kit v4's moving draft). Delete it: publishing it would tag the commit it last pointed at, with its old assets.")
          fi

          for msg in "${msgs[@]}"; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::${msg}"
            else
              echo "::error::${msg}"
            fi
          done
          if [ ${#msgs[@]} -gt 0 ] && [ "$DRY_RUN" != "true" ]; then
            exit 1
          fi

      # Check out the tooling from the same commit as the reusable workflow, so
      # consumers get the shared cliff.toml and the notes guard without keeping
      # their own copies. job.workflow_* is github.com only.
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tooling
          persist-credentials: false

      # A burned tag was created by a release run that never got published
      # (wrong commit, a build that cannot pass, a run nobody re-ran). It cannot
      # be moved or deleted, and it carries no release, so nothing was shipped
      # from it. Its changes belong to the next release: git-cliff is told to
      # ignore it, so the notes, the notes guard and the bump all start at the
      # last tag that was actually released. Drafts never get here: the guard
      # above blocks on them.
      - name: Find burned release tags
        id: burned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName --jq '.[].tagName')

          # A tag that a later release contains is not burned any more: that
          # release shipped its changes. So only tags no released tag on this
          # branch reaches count. By ancestry, not version order: v1.2.0-rc1
          # sorts after v1.2.0.
          shipped=()
          while IFS= read -r tag; do
            if grep -qxF -- "$tag" <<< "$releases"; then
              shipped+=(--no-merged "$tag")
            fi
          done < <(git tag --merged HEAD --list 'v*')

          burned=()
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || continue
            if ! grep -qxF -- "$tag" <<< "$releases"; then
              burned+=("$tag")
            fi
          done < <(git tag --merged HEAD "${shipped[@]}" --list 'v*' | sort -V)

          # Version tags on this very commit without a release: a second tag
          # here could not be ordered against them (tags carry no time).
          here=()
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || continue
            if ! grep -qxF -- "$tag" <<< "$releases"; then
              here+=("$tag")
            fi
          done < <(git tag --points-at HEAD --list 'v*' | sort -V)
          echo "unreleased_here=${here[*]}" >> "$GITHUB_OUTPUT"

          if [ ${#burned[@]} -eq 0 ]; then
            echo "burned=" >> "$GITHUB_OUTPUT"
            echo "ignore=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # shellcheck disable=SC2016 # the $ in the sed bracket expression is literal
          ignore="^($(printf '%s\n' "${burned[@]}" | sed 's/[][\.*^$()+?{}|]/\\&/g' | paste -sd '|'))$"
          echo "::notice::Tagged but never released: ${burned[*]}. Their changes go into this release."
          {
            echo "burned=${burned[*]}"
            echo "ignore=${ignore}"
          } >> "$GITHUB_OUTPUT"

      - name: Read release context
        id: ctx
        env:
          CLIFF_CONFIG: ${{ inputs.cliff_config }}
          IGNORE_TAGS: ${{ steps.burned.outputs.ignore }}
        run: |
          set -euo pipefail

          if [ ! -f "$CLIFF_CONFIG" ]; then
            echo "::error::${CLIFF_CONFIG} not found."
            exit 1
          fi

          # An empty --ignore-tags pattern would match every tag.
          ignore=()
          if [ -n "$IGNORE_TAGS" ]; then
            ignore=(--ignore-tags "$IGNORE_TAGS")
          fi

          previous_tag=$(git cliff --config "$CLIFF_CONFIG" --use-branch-tags --unreleased "${ignore[@]}" --context \
            | jq -r '.[0].previous.version // empty')
          if [ -z "$previous_tag" ]; then
            echo "::error::Could not work out the previous release tag from git-cliff."
            exit 1
          fi

          # An explicit range: --unreleased drops the commits of an ignored
          # tag, a range from the last released tag keeps them.
          git cliff --config "$CLIFF_CONFIG" --use-branch-tags "${previous_tag}..HEAD" "${ignore[@]}" --bump --context > ctx.json
          computed_version=$(jq -r '.[0].version // empty' ctx.json)

          echo "Releasing everything since ${previous_tag}."
          {
            echo "previous=${previous_tag}"
            echo "computed=${computed_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Guard - nothing is missing from the notes
        uses: ./.release-tooling/.github/actions/check-release-notes
        with:
          range: ${{ steps.ctx.outputs.previous }}..HEAD
          force: ${{ inputs.force }}

      - name: Guard - something releasable landed
        id: releasable
        if: ${{ inputs.version == '' }}
        env:
          PREVIOUS_TAG: ${{ steps.ctx.outputs.previous }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          releasable_count=$(jq '
            [ .[0].commits[] | select((.raw_message | test("^(feat|fix|perf)")) or .breaking) ] | length
          ' ctx.json)

          if [ "$releasable_count" -eq 0 ]; then
            # A push to the default branch has nothing to preview, and a
            # scheduled run has nothing to cut; only an explicitly requested
            # release (manual dispatch or tag push) should fail for this.
            if { [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; } ||
              [ "$EVENT_NAME" = "schedule" ]; then
              echo "::notice::No feat/fix/perf or breaking commits since ${PREVIOUS_TAG}; nothing to release."
              echo "releasable=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No feat/fix/perf or breaking commits since ${PREVIOUS_TAG}. Pass an explicit version to override."
            exit 1
          fi

          echo "releasable=true" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        if: ${{ steps.releasable.outputs.releasable != 'false' }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
          COMPUTED_VERSION: ${{ steps.ctx.outputs.computed }}
          UNRELEASED_HERE: ${{ steps.burned.outputs.unreleased_here }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION:-$COMPUTED_VERSION}"
          release_sha=$(git rev-parse HEAD)

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3 or v1.2.3-rc1, got '${version}'."
            exit 1
          fi

          # One unreleased tag per commit: the draft job orders tags by commit,
          # and two on the same one by version only, which need not be the
          # order they were cut in.
          if [ -n "${UNRELEASED_HERE:-}" ]; then
            echo "::error::${release_sha} already carries ${UNRELEASED_HERE// /, }, tagged but never released. Re-run that run's failed jobs, or release once a new commit has landed."
            exit 1
          fi

          # A computed version can land on a burned tag: its number is taken
          # for good, so use the next free one: the next patch, or for a
          # prerelease the next number at its end (rc1 -> rc2, alpha.2 ->
          # alpha.3). An explicit version is used as given or not at all.
          if [ -z "$INPUT_VERSION" ]; then
            while git rev-parse -q --verify "refs/tags/${version}" >/dev/null; do
              taken=$version
              if [[ "$version" == *-* ]]; then
                if [[ ! "${version#*-}" =~ ^(.*[^0-9])?([0-9]+)$ ]]; then
                  echo "::error::${taken} is taken by a tag that was never released, and its prerelease part does not end in a number. Pass an explicit version."
                  exit 1
                fi
                version="${version%%-*}-${BASH_REMATCH[1]}$((10#${BASH_REMATCH[2]} + 1))"
              else
                IFS=. read -r major minor patch <<< "${version#v}"
                version="v${major}.${minor}.$((patch + 1))"
              fi
              echo "::notice::${taken} is taken by a tag that was never released; using ${version}."
            done
          fi

          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "::error::Tag ${version} already exists."
            exit 1
          fi

          echo "Releasing ${version} from ${release_sha}."
          {
            echo "version=${version}"
            echo "sha=${release_sha}"
          } >> "$GITHUB_OUTPUT"

      # A commit is tagged only once its required checks (e2e, typically) have
      # passed on it. A commit that only touches checks_skip_paths runs no such
      # checks; it is released on those of the nearest earlier commit that
      # ran them, as long as everything since then is skippable too. A code
      # commit whose checks have not started yet therefore fails here rather
      # than being released on an older commit's result.
      - name: Guard - required checks passed
        if: ${{ steps.releasable.outputs.releasable != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.version.outputs.sha }}
          REQUIRED_CHECKS: ${{ inputs.required_checks }}
          SKIP_PATHS: ${{ inputs.checks_skip_paths }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          for json in "$REQUIRED_CHECKS" "$SKIP_PATHS"; do
            if ! jq -e 'type == "array" and all(.[]; type == "string" and length > 0)' <<< "$json" > /dev/null 2>&1; then
              echo "::error::required_checks and checks_skip_paths must be JSON arrays of non-empty strings, got: ${json}"
              exit 1
            fi
          done

          mapfile -t required < <(jq -r '.[]' <<< "$REQUIRED_CHECKS")
          mapfile -t skip < <(jq -r '.[]' <<< "$SKIP_PATHS")

          # checks_skip_paths must match what the checks' paths-ignore
          # matches, or an unchecked commit is released on older checks. As in
          # GitHub's path filters, * stops at a /, ** crosses it and a **/
          # also matches at the top level. The rest of GitHub's syntax (? + []
          # !) is refused rather than approximated.
          skip_re=()
          for p in "${skip[@]}"; do
            if [[ "$p" == *[?+\[\]\!]* ]]; then
              echo "::error::checks_skip_paths supports only * and ** wildcards, got: ${p}"
              exit 1
            fi
            re="" g=$p
            while [ -n "$g" ]; do
              case "$g" in
                '**/'*) re+='(.*/)?' g=${g#'**/'} ;;
                '**'*) re+='.*' g=${g#'**'} ;;
                '*'*) re+='[^/]*' g=${g#'*'} ;;
                *)
                  c=${g:0:1} g=${g:1}
                  case "$c" in
                    . | '^' | '$' | '(' | ')' | '|' | '{' | '}' | "\\") re+="\\${c}" ;;
                    *) re+=$c ;;
                  esac
                  ;;
              esac
            done
            skip_re+=("^${re}\$")
          done

          if [ ${#required[@]} -eq 0 ]; then
            echo "No required_checks configured."
            exit 0
          fi

          # A dry run (and so a push run, whose checks have only just started)
          # reports the state without failing.
          fail() {
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice::Not releasable yet: $1"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }

          # Every check run on the commit as "name<TAB>status<TAB>conclusion".
          # The API returns the latest run per check, so a re-run that passed
          # replaces the failure it re-ran.
          check_runs() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/$1/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv'
          }

          skippable() {
            local re
            for re in "${skip_re[@]}"; do
              if [[ $1 =~ $re ]]; then
                return 0
              fi
            done
            return 1
          }

          # Walk back along the default branch to the newest commit that ran
          # any of the required checks.
          base="" runs=""
          for commit in $(git rev-list --first-parent --max-count=50 "$SHA"); do
            runs=$(check_runs "$commit")
            for name in "${required[@]}"; do
              if cut -f1 <<< "$runs" | grep -qxF -- "$name"; then
                base=$commit
                break 2
              fi
            done
          done
          if [ -z "$base" ]; then
            fail "None of ${REQUIRED_CHECKS} ran on ${SHA} or the 49 commits before it."
          fi

          if [ "$base" != "$SHA" ]; then
            while IFS= read -r f; do
              if ! skippable "$f"; then
                fail "${SHA} has no ${REQUIRED_CHECKS} yet, and ${f} changed since ${base}, the last commit that ran them. Wait for the checks to finish, then run again."
              fi
            done < <(git diff --no-renames --name-only "$base" "$SHA")
            echo "${SHA} only changes checks_skip_paths since ${base}; using that commit's checks."
          fi

          bad=()
          for name in "${required[@]}"; do
            states=$(awk -F'\t' -v n="$name" '$1 == n { print $2 "/" $3 }' <<< "$runs" | sort -u)
            if [ "$states" != "completed/success" ]; then
              bad+=("${name}: ${states:-missing}")
            fi
          done
          if [ ${#bad[@]} -gt 0 ]; then
            fail "Required checks on ${base} have not passed: $(IFS=';'; echo "${bad[*]}")."
          fi
          echo "Required checks passed on ${base}."

      - name: Render release notes
        if: ${{ steps.releasable.outputs.releasable != 'false' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
          CLIFF_CONFIG: ${{ inputs.cliff_config }}
          PREVIOUS_TAG: ${{ steps.ctx.outputs.previous }}
          IGNORE_TAGS: ${{ steps.burned.outputs.ignore }}
          BURNED: ${{ steps.burned.outputs.burned }}
        run: |
          set -euo pipefail

          ignore=()
          if [ -n "$IGNORE_TAGS" ]; then
            ignore=(--ignore-tags "$IGNORE_TAGS")
          fi

          mkdir -p release-notes
          git cliff --config "$CLIFF_CONFIG" --use-branch-tags "${PREVIOUS_TAG}..HEAD" "${ignore[@]}" \
            --tag "$VERSION" --output release-notes/notes.md

          if [ -z "$(tr -d '[:space:]' < release-notes/notes.md)" ]; then
            echo "::error::Rendered notes are empty."
            exit 1
          fi

          if [ -n "$BURNED" ]; then
            {
              echo
              echo "> ${BURNED// /, } was tagged but never released. Its changes are included here."
            } >> release-notes/notes.md
          fi

          {
            echo "## $VERSION"
            echo
            echo "<sub>commit \`${SHA}\`</sub>"
            echo
            cat release-notes/notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The draft is checked against its tag once, when it is created. Only a
      # tag that cannot move keeps that true until someone publishes: a tag
      # moved in between would publish assets built from another commit. So
      # no tag is created without an active ruleset that refuses moving and
      # deleting it (`make repo-settings`, protect-release-tags).
      - name: Guard - release tags are protected
        if: ${{ steps.releasable.outputs.releasable != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          ref="refs/tags/${VERSION}"
          matches() { # matches <json array of ref patterns>: does one match $ref?
            local p
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              # shellcheck disable=SC2053 # $p is a glob on purpose
              if [ "$p" = "~ALL" ] || [[ $ref == $p ]]; then
                return 0
              fi
            done < <(jq -r '.[]?' <<< "$1")
            return 1
          }

          protected=""
          for id in $(gh api --paginate "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true&per_page=100" \
            --jq '.[] | select(.target == "tag" and .enforcement == "active") | .id'); do
            ruleset=$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${id}?includes_parents=true")
            rules=$(jq -c '[.rules[].type]' <<< "$ruleset")
            # A ruleset with bypass actors lets them move the tag. GitHub shows
            # bypass_actors only to ruleset admins, which this token is not, so
            # an absent list proves nothing; current_user_can_bypass at least
            # says whether this workflow could. The rest rests on the ruleset's
            # admins, who can edit it anyway.
            if jq -e '(.bypass_actors // []) | length > 0' <<< "$ruleset" > /dev/null; then
              echo "::notice::Ruleset $(jq -r .name <<< "$ruleset") has bypass actors; not counted as protection."
              continue
            fi
            if jq -e '(.current_user_can_bypass // "never") != "never"' <<< "$ruleset" > /dev/null; then
              echo "::notice::This workflow can bypass ruleset $(jq -r .name <<< "$ruleset"); not counted as protection."
              continue
            fi
            if jq -e 'index("update") and index("deletion")' <<< "$rules" > /dev/null &&
              matches "$(jq -c '.conditions.ref_name.include // []' <<< "$ruleset")" &&
              ! matches "$(jq -c '.conditions.ref_name.exclude // []' <<< "$ruleset")"; then
              protected=$(jq -r .name <<< "$ruleset")
              break
            fi
          done

          if [ -z "$protected" ]; then
            msg="No active tag ruleset refuses moving and deleting ${ref}. Without one, a tag moved before publishing ships assets built from another commit. Run 'make repo-settings' (protect-release-tags) as an admin."
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::${msg}"
              exit 0
            fi
            echo "::error::${msg}"
            exit 1
          fi
          echo "${ref} is protected by ruleset ${protected}."

      # The notes are rendered here, before the tag exists, and handed to
      # release-draft.yml as an artifact. Rendering them again after tagging
      # would see the new tag and produce a different range.
      - name: Hand over release notes
        if: ${{ !inputs.dry_run && steps.releasable.outputs.releasable != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes/notes.md
          if-no-files-found: error
          # A re-run of this job uploads again into the same run.
          overwrite: true

      # Tags the commit the notes were computed for. Release tags cannot be
      # moved or deleted where protect-release-tags is active, so a tag on the
      # wrong commit burns the version: release the next patch.
      - name: Create tag
        id: tag
        if: ${{ !inputs.dry_run && steps.releasable.outputs.releasable != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail

          if ! gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${VERSION}" -f "sha=${SHA}" > /dev/null; then
            # The request can fail after GitHub created the ref. A tag at this
            # commit is the outcome we wanted; one elsewhere is not.
            existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" \
              --jq '.object.sha' 2>/dev/null || true)
            if [ "$existing" != "$SHA" ]; then
              echo "::error::Creating tag ${VERSION} at ${SHA} failed${existing:+; it already points at ${existing}}."
              exit 1
            fi
            echo "Tag ${VERSION} already points at ${SHA}."
          fi

          echo "tag_created=true" >> "$GITHUB_OUTPUT"

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: nothing tagged or drafted. Re-run with dry_run unchecked to release." >> "$GITHUB_STEP_SUMMARY"
