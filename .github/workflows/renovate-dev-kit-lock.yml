name: renovate-dev-kit-lock

# Reusable only. Commits a relocked flake.lock to the two Renovate PRs that
# change flake.nix through regex managers, which can't update the lock:
# renovate/dev-kit (bumped tag) and renovate/go-version (goVersion, which needs
# a newer go-overlay). scripts/renovate-relock.sh does the relocking, fetched
# from the dev-kit commit this workflow was called at; it is a no-op once the
# lock is current, so a re-run after its own commit changes nothing. See
# "Governance workflows" in the README for the stub.
#
# Commits through the GitHub App's installation token, via the API: GitHub
# signs the commit (required_signatures), and unlike GITHUB_TOKEN it starts CI
# on the new head. renovate-config lists the app's bot in gitIgnoredAuthors, so
# Renovate keeps rebasing the branch; each rebase re-runs this and relocks.

on:
  workflow_call:
    inputs:
      branch:
        description: Renovate's branch for the dev-kit group.
        type: string
        default: renovate/dev-kit
      go-branch:
        description: Renovate's branch for the Go version group.
        type: string
        default: renovate/go-version
      renovate-actor:
        description: Login of the Renovate app that authors the pull requests.
        type: string
        default: renovate[bot]
    secrets:
      DEV_KIT_BOT_APP_CLIENT_ID:
        required: true
      DEV_KIT_BOT_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  relock:
    name: Relock dev-kit
    # Only Renovate's own branches in this repo: fork PRs get no secrets, and a
    # same-named branch from someone else doesn't get a bot commit.
    if: >-
      (github.event.pull_request.head.ref == inputs.branch ||
       github.event.pull_request.head.ref == inputs.go-branch) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == inputs.renovate-actor
    runs-on: ubuntu-24.04
    concurrency:
      group: renovate-dev-kit-lock-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo
          persist-credentials: false
      # The relock script, from the dev-kit commit this workflow was called at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: dev-kit
          sparse-checkout: scripts/renovate-relock.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          # Upstream Nix and no telemetry, as in setup-nix.
          determinate: false
          diagnostic-endpoint: ''
      - name: Relock
        id: relock
        working-directory: repo
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GO_BRANCH: ${{ inputs.go-branch }}
        run: ../dev-kit/scripts/renovate-relock.sh "$HEAD_REF" "$GO_BRANCH" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.relock.outputs.changed == 'true'
        id: app
        with:
          client-id: ${{ secrets.DEV_KIT_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_KIT_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit flake.lock
        if: steps.relock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WHAT: ${{ steps.relock.outputs.what }}
        run: |
          # createCommitOnBranch, not git push: GitHub signs API commits.
          # expectedHeadOid makes it fail instead of clobbering a newer push;
          # that push re-runs this workflow anyway.
          jq -n --arg repo "$REPO" --arg branch "$BRANCH" --arg head "$HEAD_SHA" \
            --arg headline "chore(deps): relock $WHAT in flake.lock" \
            --arg lock "$(base64 -w0 repo/flake.lock)" '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                message: { headline: $headline },
                expectedHeadOid: $head,
                fileChanges: { additions: [{ path: "flake.lock", contents: $lock }] }
              } }
            }' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid'
