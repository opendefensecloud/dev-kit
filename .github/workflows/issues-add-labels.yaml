name: Label issues

# Empty on purpose. A caller can only hand down what its own job has, and the
# stub in the README calls this with `issues: write` alone — a job-level block
# replaces the workflow-level one rather than merging, so the caller's job has
# no `contents`. Asking for it here fails the caller at startup, before a
# single job runs.
permissions: {}

on:
  issues:
    types:
      - reopened
      - opened
  workflow_call:
jobs:
  label_issues:
    runs-on: ubuntu-24.04
    # `gh issue edit` needs issues:write and nothing else — no checkout, no
    # other API surface.
    permissions:
      issues: write
    steps:
      - run: gh issue edit "$NUMBER" --add-label "$LABELS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: needs-triage
