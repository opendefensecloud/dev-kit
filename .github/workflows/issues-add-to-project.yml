name: Add issues to project

# Empty on purpose. A caller can only hand down what its own job has, and the
# stub in the README calls this with `permissions: {}`. Asking for anything
# here fails the caller at startup, before a single job runs.
permissions: {}

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened
  workflow_call:
    secrets:
      ADD_TO_PROJECT_PAT:
        required: true

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-26.04
    # Authenticates with ADD_TO_PROJECT_PAT, so the workflow GITHUB_TOKEN needs no scopes.
    permissions: {}
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/opendefensecloud/projects/3
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
