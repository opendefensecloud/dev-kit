name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.0.0. Leave empty and it is computed from the commits.'
        required: false
        type: string
      dry_run:
        description: 'Render the version and notes only. Do not create or update a release, or create a tag.'
        required: false
        type: boolean
        default: true
      force:
        description: 'Release even though commits are missing from the notes. Recovery only.'
        required: false
        type: boolean
        default: false
      create_tag:
        description: 'Create the release tag now instead of when the draft is published. Leave unchecked to only update the draft.'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      # A push keeps the draft up to date; it never tags or publishes. The
      # `inputs` context is empty on push, so each value is selected by the
      # event and still has the declared type.
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      create_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.create_tag }}
