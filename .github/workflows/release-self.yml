name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.0.0. Leave empty and it is computed from the commits.'
        required: false
        type: string
      dry_run:
        description: 'Render the version and notes only. Do not tag or create a release.'
        required: false
        type: boolean
        default: true
      force:
        description: 'Release even though commits are missing from the notes. Recovery only.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
      force: ${{ inputs.force }}
