# Cuts a release: tags the commit, then drafts the GitHub release. Publish the
# draft by hand. To attach assets, add a build job between the two calls. See
# docs/RELEASES.md. Pin both workflows to the same dev-kit commit.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.0.0. Leave empty and it is computed from the commits.'
        required: false
        type: string
      dry_run:
        description: 'Render the version and notes only. Do not tag or draft.'
        required: false
        type: boolean
        default: true
      force:
        description: 'Release even though commits are missing from the notes. Recovery only.'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Releases queue one at a time and are never cancelled: a run in flight may
  # already have tagged. Push previews get their own group, so a merge cannot
  # cancel a release dispatch waiting in the queue.
  group: ${{ github.event_name == 'workflow_dispatch' && 'release' || 'release-preview' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  release:
    uses: opendefensecloud/dev-kit/.github/workflows/release.yml@<40-char-sha> # <tag>
    permissions:
      contents: write # create the tag
      checks: read # required_checks
    with:
      # A push only previews the next release in the job summary: it is always
      # a dry run. The `inputs` context is empty on push, so each value is
      # selected by the event and still has the declared type.
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      dry_run: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      # Checks that must have passed on the released commit, e.g. your e2e job.
      required_checks: '["test-e2e / test-e2e"]'

  draft:
    needs: release
    if: ${{ needs.release.outputs.tag_created == 'true' }}
    uses: opendefensecloud/dev-kit/.github/workflows/release-draft.yml@<40-char-sha> # <tag>
    permissions:
      contents: write # create the draft release
    with:
      version: ${{ needs.release.outputs.version }}
      sha: ${{ needs.release.outputs.sha }}
