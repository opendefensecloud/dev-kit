# Runs make targets inside the dev shell. setup-nix needs the Cachix secrets
# passed in, because composite actions cannot read secrets. See
# docs/GITHUB_ACTIONS.md.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - uses: actions/checkout@<40-char-sha> # v7
      - name: Set up nix
        uses: opendefensecloud/dev-kit/.github/actions/setup-nix@<40-char-sha> # <tag>
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}
      - run: make test
