# Docs site, published to GitHub Pages by .github/workflows/docs.yml.
# Preview locally with `hugo server -s site` (needs hugo and go on PATH).
baseURL = "https://opendefensecloud.github.io/dev-kit/"
title = "dev-kit"
disableKinds = ["taxonomy", "term"]

# The docs index takes its front matter from here: `make fmt` runs mdformat,
# which rewrites a front matter block into a heading.
[[cascade]]
  title = "Documentation"
  [cascade.target]
    path = "/docs"

[params]
  # Used by layouts/_markup/render-link.html for links to repository files.
  repo = "https://github.com/opendefensecloud/dev-kit"

[params.navbar]
  displayTitle = true

[params.footer]
  displayPoweredBy = false

[module]
  [module.hugoVersion]
    min = "0.146.0"
  [[module.imports]]
    path = "github.com/imfing/hextra"
  # The pages live in ../docs, without front matter, so they read the same on
  # GitHub. content/docs/_content.gotmpl turns each one into a page.
  [[module.mounts]]
    source = "../docs"
    target = "assets/docs"
  # Mounting into assets replaces the default assets mount, so restore it.
  [[module.mounts]]
    source = "assets"
    target = "assets"

[[menu.main]]
  name = "Documentation"
  pageRef = "/docs"
  weight = 1
[[menu.main]]
  name = "Search"
  weight = 2
  [menu.main.params]
    type = "search"
[[menu.main]]
  name = "GitHub"
  weight = 3
  url = "https://github.com/opendefensecloud/dev-kit"
  [menu.main.params]
    icon = "github"
